<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Campus Lost & Found | Find and Report Lost Items</title>

    <meta
      name="description"
      content="Campus Lost & Found helps students and staff report lost items, browse found belongings, and reconnect owners with their valuables quickly and securely."
    />

    <meta
      name="keywords"
      content="campus lost and found, lost items, found items, university lost property, student portal, report lost item, claim found item"
    />

    <meta name="author" content="Campus Lost & Found Team" />

    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#F97316" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Campus Lost & Found" />
    <meta
      property="og:description"
      content="Report, browse and reclaim lost items on campus."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:url" content="https://your-domain.com" />
    <meta property="og:site_name" content="Campus Lost & Found" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Campus Lost & Found" />
    <meta
      name="twitter:description"
      content="Helping students recover lost belongings."
    />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
